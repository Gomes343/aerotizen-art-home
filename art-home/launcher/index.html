<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Art Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- the artwork: two layers cross-fading -->
  <div id="stage">
    <div class="layer" id="layer-a"><img alt=""></div>
    <div class="layer" id="layer-b"><img alt=""></div>
  </div>
  <div id="veil"></div>
  <div id="dimmer"></div>

  <div id="ui">
    <header>
      <div id="clock-block">
        <div id="clock">--:--</div>
        <div id="date"></div>
      </div>
      <div id="weather" hidden>
        <div id="weather-temp"></div>
        <div id="weather-text"></div>
      </div>
    </header>
    <footer>
      <nav id="apps"></nav>
      <div id="credit"></div>
    </footer>
  </div>

  <div id="cameras" hidden>
    <div id="cam-title"></div>
    <div id="cam-grid"></div>
    <div id="cam-hint"></div>
  </div>
  <div id="cam-full" hidden>
    <video id="cam-video" autoplay muted playsinline></video>
    <div id="cam-full-top"><span id="cam-full-name"></span> <span id="cam-full-note"></span></div>
    <div id="cam-full-hint"></div>
  </div>

  <div id="alert">
    <img id="alert-photo" alt="">
    <div id="alert-text"><div id="alert-title"></div><div id="alert-time"></div></div>
  </div>

  <div id="toast" hidden></div>

  <script src="settings.js"></script>      <!-- generated by build.sh from your config -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="aero-bridge.js"></script>
  <script src="js/homewatch.js"></script>  <!-- AeroTizen's, unchanged -->
  <script src="i18n.js"></script>
  <script src="cameras.js"></script>
  <script src="app.js"></script>
  <script src="alerts.js"></script>
  <script src="energy.js"></script>
</body>
</html>

# Art Home server in Docker. Copy to docker-compose.yml next to your config.json.
#   docker compose up -d        (HA_TOKEN in a .env file next to it)
#   docker exec -it art-home python photos.py login     (once, only if you use Google Photos)
services:
  art-home:
    image: python:3.13-slim
    container_name: art-home
    restart: unless-stopped
    network_mode: host                     # serves port 8895 on the LAN
    working_dir: /srv
    command: ["python", "-u", "server.py"]
    environment:
      ART_HOME_CONFIG: /config.json
      ART_HOME_ART: /srv/art
      ART_HOME_APP: /package
      ART_HOME_DATA: /data
      HA_TOKEN: ${HA_TOKEN:-}
    volumes:
      - ./server:/srv:ro                   # server.py, photos.py, photos.html, demo/ and art/
      - ./server/data:/data                # Google Photos: the downloaded photos and the sign-in (written)
      - ./config.json:/config.json:ro
      - ./dist/package:/package:ro         # browser preview at /app/
      - /etc/localtime:/etc/localtime:ro   # the night window uses this clock — without it, UTC
    mem_limit: 128m
